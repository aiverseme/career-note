<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- ① 문서 기본 정보: 글자 인코딩, 휴대폰 화면 맞춤, 탭 제목 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티칭로그 Teaching Log</title>
  <meta name="apple-mobile-web-app-title" content="티칭로그">
  <meta name="application-name" content="티칭로그">
  <meta name="theme-color" content="#1f5e46">

  <!-- ② 글꼴과 디자인(CSS) 불러오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ③ 상단 메뉴: 각 링크의 #이름이 화면 이름이 됩니다 -->
  <header class="top">
    <a class="brand" href="#today">티칭로그 <span class="brand-en">Teaching Log</span></a>
    <nav class="nav scroll" aria-label="주요 메뉴">
      <a href="#today">오늘</a>
      <a href="#schedule">일정</a>
      <a href="#career">커리어</a>
      <a href="#money">수입·지출</a>
      <a href="#data">설정</a>
    </nav>
    <span class="sync" id="sync" hidden></span>
  </header>

  <!-- ③-1 로그인 화면: 로그인 전에는 이것만 보입니다 -->
  <section class="auth" id="auth" hidden>
    <form class="auth-card" id="authForm">
      <h1>티칭로그</h1>
      <p class="brand-en" style="margin-top:-8px">Teaching Log</p>
      <p class="mute">강의 이력, 일정, 가계부를 한곳에서. 내 데이터는 로그인한 나만 볼 수 있어요.</p>
      <button type="button" class="btn gbtn" id="btnGoogle">Google 계정으로 계속하기</button>
      <div class="or"><span>또는 이메일로</span></div>
      <label class="fl"><span>이메일</span><input type="email" id="authEmail" autocomplete="email" required></label>
      <label class="fl"><span>비밀번호 (6자 이상)</span><input type="password" id="authPw" autocomplete="current-password" minlength="6" required></label>
      <p class="auth-msg" id="authMsg" role="alert"></p>
      <button class="btn pri" id="btnIn">로그인</button>
      <button type="button" class="btn ghost" id="btnUp">처음이에요 · 가입하기</button>
    </form>
  </section>

  <!-- ④ 화면들: 한 번에 하나만 보입니다. 내용은 app.js가 채웁니다 -->
  <main id="app" hidden>
    <section class="view" id="v-today"></section>
    <section class="view" id="v-schedule" hidden></section>
    <section class="view" id="v-career" hidden></section>
    <section class="view" id="v-money" hidden></section>
    <section class="view" id="v-data" hidden></section>
  </main>

  <!-- ⑤ 입력 창(팝업)과 확인 창, 알림 -->
  <dialog id="dlg"></dialog>
  <dialog id="ask">
    <form method="dialog">
      <p id="askMsg"></p>
      <div class="acts"><span class="sp"></span>
        <button value="no" class="btn ghost">취소</button>
        <button value="ok" class="btn pri danger">확인</button>
      </div>
    </form>
  </dialog>
  <dialog id="copyDlg">
    <form method="dialog">
      <h2>아래 내용을 복사해 쓰세요</h2>
      <textarea id="copyArea" rows="12" readonly></textarea>
      <div class="acts"><span class="sp"></span><button class="btn pri">닫기</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ⑥ 동작(JavaScript): Supabase 도구 → 연결 정보 → 저장 담당 → 화면 담당 순서 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
